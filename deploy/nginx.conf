# /etc/nginx/sites-available/inkdoc on each web server.
server {
    listen 80 default_server;
    listen [::]:80 default_server;
    server_name _;

    root /opt/inkdoc/frontend/dist;
    index index.html;
    client_max_body_size 110M;

    # Server-level add_header is inherited only by locations without their own add_header.
    add_header X-Served-By $hostname always;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/markdown application/javascript application/json image/svg+xml;

    location /api/ {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Vite fingerprints these filenames, so they can be cached forever.
    location /assets/ {
        expires 1y;
        try_files $uri =404;
    }

    location / {
        expires -1;
        try_files $uri $uri/ /index.html;
    }
}
