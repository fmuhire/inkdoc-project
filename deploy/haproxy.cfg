# /etc/haproxy/haproxy.cfg on lb-01. provision_lb.sh fills in the ${HAPROXY_STATS_*} values.
global
    log /dev/log local0
    maxconn 4096
    user haproxy
    group haproxy
    daemon

defaults
    mode http
    log global
    option httplog
    option dontlognull
    option forwardfor
    timeout connect 5s
    timeout client 180s
    timeout server 180s
    timeout http-request 30s

frontend inkdoc_http
    bind *:80
    default_backend inkdoc_web

backend inkdoc_web
    balance roundrobin
    option httpchk GET /api/health
    http-check expect status 200
    server web-01 35.175.138.189:80 check inter 5s fall 3 rise 2
    server web-02 34.201.249.145:80 check inter 5s fall 3 rise 2

listen stats
    bind *:8404
    stats enable
    stats uri /
    stats refresh 10s
    stats auth ${HAPROXY_STATS_USER}:${HAPROXY_STATS_PASS}
